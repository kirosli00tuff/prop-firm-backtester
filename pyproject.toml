[project]
name = "pfb"
version = "0.1.0"
description = "Laptop-scale futures backtester with prop-firm economics."
requires-python = ">=3.12,<3.13"
dependencies = [
    "arch>=9.0.0",
    "duckdb>=2.0.0",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "streamlit>=1.67.0",
    "typer>=0.29.1",
]

[project.scripts]
pfb = "pfb.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfb"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pfb"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running test",
]
