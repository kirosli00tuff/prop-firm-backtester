# config/closed_windows.toml: the closed-window table. Made-up windows for the demo.
#
# Binding on every bar read. The DataGateway refuses (raises, never filters silently) any requested or returned
# row that falls in a window below. This file's sha256 is pinned in src/pfb/data/windows.py
# (CLOSED_WINDOWS_SHA256); a change here without the matching pin fails closed. With your own data, replace the
# windows with your own holdouts and embargoes and update the pin in the same change.
#
# How a row of root R is matched against a window (R matches when products is ["*"] or lists R):
#   1. by label: first_trade_date <= the stored CME trade_date <= last_trade_date (both inclusive);
#   2. by time:  utc_start <= ts_event (the bar open, UTC) < utc_end.
# Either match closes the row. A request is refused when its trade-date range touches a label range for R.
# The time span is a superset of every minute a CME group books to the window's trade dates: it starts one
# minute after the 16:00 CT close of the last trade date before the window that is a regular session for every
# group, and ends at the 17:00 CT open of the first session after the window, so a mislabelled row cannot pass.
#
# kind: "sealed holdout", "embargo", "sealed test window" or "closed by decision".
# rows_on_disk is BY LABEL: whether the demo store holds rows whose stored trade_date lies in the label range.

schema = "pfb.closed_windows/1"

[[window]]
id = "demo_holdout_tail"
products = ["*"]
first_trade_date = "2026-05-18"
last_trade_date = "9999-12-31"
utc_start = "2026-05-15T21:01:00Z"
utc_end = "9999-12-31T00:00:00Z"
kind = "sealed holdout"
rows_on_disk = false
note = "Open-ended: every trade date from 2026-05-18 on is sealed. utc_start is Friday 2026-05-15 16:01 CT, the close of the last regular session before the window."

[[window]]
id = "demo_embargo_tail"
products = ["*"]
first_trade_date = "2026-05-09"
last_trade_date = "2026-05-17"
utc_start = "2026-05-08T21:01:00Z"
utc_end = "2026-05-17T22:00:00Z"
kind = "embargo"
rows_on_disk = true
note = "The week before the holdout. The demo store holds rows labelled 2026-05-11..2026-05-15; every request touching them is refused."

[[window]]
id = "demo_holdout_2022"
products = ["*"]
first_trade_date = "2022-02-28"
last_trade_date = "2022-11-30"
utc_start = "2022-02-25T22:01:00Z"
utc_end = "2022-11-30T23:00:00Z"
kind = "sealed holdout"
rows_on_disk = false
note = "A second sealed span. utc_start is Friday 2022-02-25 16:01 CT, the close of the last regular session before the window."

[[window]]
id = "demo_embargo_2022_02"
products = ["*"]
first_trade_date = "2022-02-01"
last_trade_date = "2022-02-27"
utc_start = "2022-01-31T22:01:00Z"
utc_end = "2022-02-27T23:00:00Z"
kind = "embargo"
rows_on_disk = false
note = "The four weeks before the second holdout."
