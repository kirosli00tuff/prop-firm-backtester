# config/costs.toml: the pins of the slippage tables (ADR-001 section 6, A7). Fictional values for the demo.
#
# Both tables are generated by src/pfb/costs/demo_tables.py (`uv run python -m pfb.costs.demo_tables`) and are
# not calibrated on any market. A table is refused unless its bytes hash to the sha256 pinned here. To use your
# own tables, point config/paths.toml [costs] book_table / release_calendar at them and pin their sha256 here.

schema = "pfb.costs/1"

[book]
table = "config/demo/book_costs.json"   # relative to the repository root
sha256 = "c7b909f1214e48ccdac214fd9110e303c0c3bca4bd047fb7947e89a7a55be011"
products = 45
depth_term = "applied"

# The release calendar of event-window costs (event_costs = "on"; src/pfb/costs/events.py): a made-up
# schedule of daily, mid-month and weekly reports.
[events]
calendar = "config/demo/release_calendar.json"   # relative to the repository root
sha256 = "d56d981905ca000e9ef83b323c03b7340c0a1e8378f571c7e41ae84a9bfe40e7"
schema = "pfb.release_calendar/1"
releases = 486
coverage_first = 2025-01-01
coverage_last = 2026-06-30
window_minutes = 30
