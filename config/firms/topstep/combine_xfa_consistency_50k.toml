# Topstep 50K Trading Combine -> Express Funded Account, consistency payout path (pfb-rules-1).
# Headline choices: Standard pricing path, DLL not chosen, Back2Funded off (not modelled by pfb-rules-1).
# Source: the firm's public help centre, read 2026-11-16.

schema = "pfb-rules-1"
firm = "topstep"
plan = "combine_xfa_consistency"
size = "50k"
label = "Topstep 50K Trading Combine, Standard pricing path, XFA Consistency payout path"
status = "sourced"
version = { n = 1, rules_read = "2026-11-16", read_in = "removed in the public copy" }
effective_from = { v = "2026-10-10", src = "E19", note = "earliest lookup that shows these rules (the rules fetch); the Tier 1 news rule was refreshed 2026-10-21" }

[eval]
start_balance_cents = { v = 5000000, src = "A2_balance" }
profit_target_cents = { v = 300000, src = "R068" }
target_check = { v = "eod", src = "R074", kind = "inferred", note = "best day and profit lock at 3:10 PM CT (R074 note); the pass is tested at the close" }
drawdown_cents = { v = 200000, src = "R069" }
drawdown_type = { v = "eod_trailing", src = "R070" }
breach_check = { v = "intraday", src = "R070", note = "R070 note: breach checked in real time on realized + unrealized P&L" }
breach_at_equal = { v = true, src = "R070", kind = "conservative", note = "equity touching the MLL is a breach (the day step tests worst <= -D_open)" }
drawdown_lock_rel_cents = { v = 0, src = "R071" }
daily_loss_cents = { v = "none", src = "R072", alt = [100000], note = "headline: DLL not chosen. The optional DLL is $1,000 soft (R073), chosen at checkout" }
daily_loss_kind = { v = "none", src = "R072", alt = ["soft"], note = "soft if chosen (R073: not a rule violation)" }
consistency_type = { v = "best_day_frac_of_profit", src = "R074", note = "exceeding raises the target to best day / 0.55: same as best <= 55% of profit" }
consistency_bps = { v = 5500, src = "R075" }
consistency_strict = { v = true, src = "R029", kind = "conservative", alt = [false] }
min_trading_days = { v = 2, src = "R076" }
min_winning_days = { v = 0, src = "R076", kind = "inferred", note = "no winning-day rule in the Combine" }
winning_day_cents = { v = "none", src = "R076", kind = "inferred", note = "no winning-day rule in the Combine" }
max_contracts_minis = { v = 5, src = "R077" }
time_limit_calendar_days = { v = "none", src = "R007" }
flat_by = { v = "15:10_ct", src = "R032", note = "informational; the run enforces its own flat time" }
news_rule = { v = "tier1_no_open_5min", src = "R040", note = "refresh: no new opens on minis 5 min before to 5 min after Tier 1 releases; micros capped; not modelled by the engine" }

[funded]
start_balance_cents = { v = 0, src = "R080" }
drawdown_cents = { v = 200000, src = "R081" }
drawdown_type = { v = "eod_trailing", src = "R082" }
breach_check = { v = "intraday", src = "R082" }
breach_at_equal = { v = true, src = "R082", kind = "conservative", note = "touching the MLL is a breach (as in the day step)" }
drawdown_lock_rel_cents = { v = 0, src = "R083" }
daily_loss_cents = { v = "none", src = "R085", alt = [100000], note = "headline: DLL not chosen ($1,000 soft if chosen at Combine checkout)" }
daily_loss_kind = { v = "none", src = "R085", alt = ["soft"] }
floor_after_first_payout_rel_cents = { v = 0, src = "R084" }
scaling = { v = [[150000, 2], [200000, 3], ["none", 5]], src = "R086", note = "R086-R091 (transcribed from an image on the page): below $1,500: 2; $1,500-$2,000: 3; above: 5 minis" }
scaling_boundary = { v = "lower", src = "R092", kind = "conservative", alt = ["upper"], note = "R092 UNSOURCED: the page does not say; the lower (stricter) tier at a boundary" }
payout_count_limit = { v = "none", src = "R105", kind = "inferred", note = "R105 UNSOURCED: no cap found; call-up is discretionary (R011) and the run treats it as no trigger" }
inactivity_days = { v = 30, src = "R010" }
funded_reset_cents = { v = 59900, src = "R106", note = "Back2Funded: $599 to reactivate a breached 50K XFA, at most 2 per XFA (R108), only before its first payout (R109), within 30 calendar days of the closure (R110), $50 off with a DLL (R107); read again 2026-11-16, the Back2Funded article is unchanged since the earlier read. Not modelled: the run never buys it" }

[payout]
path = { v = "consistency", src = "R099" }
win_day_cents = { v = "none", src = "R099", kind = "inferred", note = "no winning-day rule on the Consistency path" }
win_day_strict = { v = false, src = "R099", kind = "inferred", note = "unused on this path" }
win_days_required = { v = 0, src = "R099", kind = "inferred", note = "no winning-day rule on the Consistency path" }
traded_days_required = { v = 3, src = "R099" }
net_positive_since_last = { v = true, src = "R104", kind = "inferred", note = "R104 INFERRED" }
net_min_first_cents = { v = "none", src = "R098", kind = "inferred", note = "no window-net minimum beyond > 0" }
net_min_later_cents = { v = "none", src = "R098", kind = "inferred", note = "no window-net minimum beyond > 0" }
min_balance_rel_cents = { v = "none", src = "R058", kind = "inferred", note = "R058 CONFLICT: a stale marketing page names a minimum payout balance with no amount; the help centre states only the $0.01 rule; no minimum is modelled" }
buffer_rel_cents = { v = "none", src = "R095", kind = "inferred", note = "no buffer; the request is capped at 50% of the balance" }
frac_of_profit_bps = { v = 5000, src = "R101", note = "50% of the XFA balance (= profit)" }
min_request_cents = { v = 12500, src = "R008" }
caps_cents = { v = [300000], src = "R102", alt = [[600000]], note = "per request; $6,000 with a DLL chosen at Combine purchase (R103, not chosen)" }
window_cap_bps = { v = "none", src = "R102" }
window_cap_from_payout = { v = 1, src = "R102", note = "unused (no window cap)" }
consistency_bps = { v = 4000, src = "R100" }
consistency_scope = { v = "window", src = "R100" }
consistency_strict = { v = false, src = "R030" }
request_weekday = { v = "none", src = "R093", kind = "inferred", note = "any day" }
window_calendar_days = { v = "none", src = "R093", kind = "inferred", note = "no calendar-day payout window stated (the window is in trading days)" }
dead_days_after_payout = { v = 0, src = "R009", kind = "inferred" }
payout_day_counts = { v = false, src = "R009", note = "the day the request is processed (the next trading day after the eligible close) does not count toward the next window" }
split_bps = { v = 9000, src = "R002" }
split_first_full_cents = { v = "none", src = "R002", note = "the legacy 100%-of-first-$10,000 exception does not apply to new accounts (R002 note)" }

[fees]
billing = { v = "monthly", src = "R003" }
eval_price_cents = { v = 4900, src = "R062", alt = [9500], note = "Standard path (headline pricing path); No Activation Fee path $95 (R063)" }
billing_period_calendar_days = { v = 30, src = "R003" }
reset_cents = { v = 4900, src = "R064" }
rebill_adds_reset_credit = { v = true, src = "R004" }
reset_pushes_rebill = { v = true, src = "R005" }
activation_cents = { v = 14900, src = "R078", note = "Standard path, once per XFA earned" }
funded_monthly_cents = { v = 0, src = "R078", kind = "inferred", note = "no XFA monthly fee in the record" }
platform_monthly_cents = { v = 1450, src = "R043", alt = [2900], note = "TopstepX API for a bot, discounted price; list price $29 (R043 readings)" }

