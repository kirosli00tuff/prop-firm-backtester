# MyFundedFutures Pro 50K (redesigned Pro plan, 2026-10-14), pfb-rules-1.
# Source: the firm's public help centre, read 2026-11-16.

schema = "pfb-rules-1"
firm = "mffu"
plan = "pro"
size = "50k"
label = "MyFundedFutures Pro 50K (redesigned 2026-10-14): EOD trailing, 14-day payouts up to $100,000"
status = "sourced"
version = { n = 1, rules_read = "2026-11-16", read_in = "removed in the public copy" }
effective_from = { v = "2026-10-14", src = "M_PRO_ART", note = "redesigned Pro plan article dated 2026-10-14; old Pro accounts keep the old rules" }

[eval]
start_balance_cents = { v = 5000000, src = "M_PRO_PAGE" }
profit_target_cents = { v = 300000, src = "M_PRO_ART" }
target_check = { v = "eod", src = "M_PRO_ART", kind = "conservative", alt = ["intraday"], note = "not stated; eod is the stricter reading" }
drawdown_cents = { v = 200000, src = "M_PRO_ART" }
drawdown_type = { v = "eod_trailing", src = "M_PRO_PAGE" }
breach_check = { v = "intraday", src = "M_EOD", note = "an open position dipping below the minimum balance fails the evaluation" }
breach_at_equal = { v = false, src = "M_EOD" }
drawdown_lock_rel_cents = { v = 10000, src = "M_EOD", kind = "inferred", note = "general Max EOD article: locks at start + $100; the Pro pages do not repeat it for the evaluation" }
daily_loss_cents = { v = "none", src = "M_PRO_ART" }
daily_loss_kind = { v = "none", src = "M_PRO_ART" }
consistency_type = { v = "best_day_frac_of_profit", src = "M_PRO_PAGE", alt = ["best_day_frac_of_target"] }
consistency_bps = { v = 5000, src = "M_PRO_ART" }
consistency_strict = { v = false, src = "M_PRO_PAGE" }
min_trading_days = { v = 2, src = "M_PRO_ART" }
min_winning_days = { v = 0, src = "M_PRO_ART", kind = "inferred" }
winning_day_cents = { v = "none", src = "M_PRO_ART", kind = "inferred" }
max_contracts_minis = { v = 3, src = "M_PRO_ART", note = "3 mini / 30 micro" }
time_limit_calendar_days = { v = "none", src = "M_INACT", kind = "inferred", note = "no deadline; 7-calendar-day inactivity closure applies" }
flat_by = { v = "16:10_et", src = "M_TIMES", note = "informational" }
news_rule = { v = "unrestricted", src = "M_PRO_ART" }

[funded]
start_balance_cents = { v = 5000000, src = "M_PRO_ART", kind = "inferred" }
drawdown_cents = { v = 200000, src = "M_PRO_ART" }
drawdown_type = { v = "eod_trailing", src = "M_PRO_PAGE" }
breach_check = { v = "intraday", src = "M_EOD", kind = "conservative", alt = ["eod"], note = "the general EOD article fails intraday dips; the Pro pages do not say" }
breach_at_equal = { v = false, src = "M_EOD" }
drawdown_lock_rel_cents = { v = "none", src = "M_PRO_PAGE", alt = [10000] }
daily_loss_cents = { v = "none", src = "M_PRO_ART" }
daily_loss_kind = { v = "none", src = "M_PRO_ART" }
floor_after_first_payout_rel_cents = { v = 10000, src = "M_PRO_ART" }
scaling = { v = [["none", 3]], src = "M_PRO_PAGE" }
scaling_boundary = { v = "lower", src = "M_PRO_PAGE", kind = "inferred", note = "one tier: unused" }
payout_count_limit = { v = 3, src = "M_PRO_ART", kind = "conservative", alt = ["none"], note = "three consecutive payouts trigger a live-transition review, not an automatic move; the funded account taken to end after the 3rd (live stage valued at 0), as for Builder" }
inactivity_days = { v = 7, src = "M_INACT", note = "informational" }
funded_reset_cents = { unknown = "not published on the firm's help pages, read 2026-11-17: the resets article (M_RESET_E3) and the Rapid EOD 50k article name no reset of a breached Sim Funded account and no price", src = "M_RESET_E3", note = "not modelled: the run never buys one; never assumed available" }

[payout]
path = { v = "pro", src = "M_PRO_ART" }
win_day_cents = { v = "none", src = "M_PRO_PAGE", kind = "inferred" }
win_day_strict = { v = false, src = "M_PRO_PAGE", kind = "inferred", note = "unused" }
win_days_required = { v = 0, src = "M_PRO_PAGE", kind = "inferred" }
traded_days_required = { v = 0, src = "M_PRO_PAGE", kind = "inferred", alt = [10] }
net_positive_since_last = { v = false, src = "M_PRO_PAGE", kind = "inferred" }
net_min_first_cents = { v = "none", src = "M_PRO_PAGE", kind = "inferred" }
net_min_later_cents = { v = "none", src = "M_PRO_PAGE", kind = "inferred" }
min_balance_rel_cents = { v = 210000, src = "M_PRO_PAGE", kind = "conservative", alt = ["none"], note = "plan page (2026-10-14): buffer must be cleared; the older payout policy (2026-08-25) lets a trader withdraw up to 60% of profits before clearing it" }
buffer_rel_cents = { v = 210000, src = "M_PRO_PAGE" }
frac_of_profit_bps = { v = 10000, src = "M_PRO_PAGE", kind = "inferred", note = "no percentage limit above the buffer" }
min_request_cents = { v = 100000, src = "M_PRO_ART" }
caps_cents = { v = [10000000], src = "M_PRO_ART" }
window_cap_bps = { v = "none", src = "M_PRO_ART" }
window_cap_from_payout = { v = 1, src = "M_PRO_ART", note = "unused (no window cap)" }
consistency_bps = { v = "none", src = "M_PRO_ART" }
consistency_scope = { v = "window", src = "M_PRO_ART", kind = "inferred", note = "unused" }
consistency_strict = { v = false, src = "M_PRO_ART", kind = "inferred", note = "unused" }
request_weekday = { v = "none", src = "M_PRO_ART", kind = "inferred" }
window_calendar_days = { v = 14, src = "M_PRO_ART", kind = "conservative" }
dead_days_after_payout = { v = 0, src = "M_PRO_ART", kind = "inferred" }
payout_day_counts = { v = false, src = "M_PRO_ART", kind = "conservative", alt = [true], note = "not stated" }
split_bps = { v = 8000, src = "M_PRO_ART" }
split_first_full_cents = { v = "none", src = "M_PRO_ART", kind = "inferred" }

[fees]
billing = { v = "one_time", src = "M_PRO_PAGE" }
eval_price_cents = { v = 26500, src = "M_PRO_PAGE", alt = [15900] }
billing_period_calendar_days = { v = "none", src = "M_PRO_PAGE" }
reset_cents = { unknown = "no MFFU page states a reset price", src = "M_RESET", alt = ["none"], note = "alt none = a new evaluation at the list price" }
rebill_adds_reset_credit = { v = false, src = "M_RESET" }
reset_pushes_rebill = { v = false, src = "M_RESET" }
activation_cents = { v = 0, src = "M_PRO_ART" }
funded_monthly_cents = { v = 0, src = "M_PRO_ART", kind = "inferred" }
platform_monthly_cents = { v = 0, src = "M_PRO_ART", kind = "inferred", note = "no MFFU API or API fee documented" }

