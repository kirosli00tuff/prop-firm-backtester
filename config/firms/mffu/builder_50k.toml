# MyFundedFutures Builder 50K, Default MLL option ($2,000), pfb-rules-1.
# Source: the firm's public help centre, read 2026-11-16.

schema = "pfb-rules-1"
firm = "mffu"
plan = "builder"
size = "50k"
label = "MyFundedFutures Builder 50K, Default MLL ($2,000): EOD trailing, soft DLL, 5 sim payouts"
status = "sourced"
version = { n = 1, rules_read = "2026-11-16", read_in = "removed in the public copy" }
effective_from = { v = "2026-08-25", src = "M_RESET", note = "one-time payment model for purchases from 2026-08-25; the guide itself was last edited 2026-10-21" }

[eval]
start_balance_cents = { v = 5000000, src = "M_BUILDER_ART" }
profit_target_cents = { v = 300000, src = "M_BUILDER_ART" }
target_check = { v = "eod", src = "M_BUILDER_ART", kind = "conservative", alt = ["intraday"], note = "pages do not say whether touching the target intraday passes; eod is the stricter reading" }
drawdown_cents = { v = 200000, src = "M_BUILDER_ART" }
drawdown_type = { v = "eod_trailing", src = "M_BUILDER_ART" }
breach_check = { v = "intraday", src = "M_EOD", kind = "conservative", alt = ["eod"] }
breach_at_equal = { v = false, src = "M_EOD" }
drawdown_lock_rel_cents = { v = 10000, src = "M_BUILDER_ART" }
daily_loss_cents = { v = 100000, src = "M_BUILDER_ART" }
daily_loss_kind = { v = "soft", src = "M_BUILDER_ART" }
consistency_type = { v = "none", src = "M_BUILDER_ART" }
consistency_bps = { v = "none", src = "M_BUILDER_ART" }
consistency_strict = { v = false, src = "M_BUILDER_ART", kind = "inferred", note = "unused" }
min_trading_days = { v = 1, src = "M_BUILDER_ART", alt = [2] }
min_winning_days = { v = 0, src = "M_BUILDER_ART", kind = "inferred" }
winning_day_cents = { v = "none", src = "M_BUILDER_ART", kind = "inferred" }
max_contracts_minis = { v = 4, src = "M_BUILDER_ART", note = "4 minis / 40 micros" }
time_limit_calendar_days = { v = "none", src = "M_INACT", kind = "inferred", note = "no deadline; 7-calendar-day inactivity closure applies" }
flat_by = { v = "16:10_et", src = "M_TIMES", note = "informational" }
news_rule = { v = "unrestricted", src = "M_BUILDER_ART" }

[funded]
start_balance_cents = { v = 0, src = "M_BUILDER_ART" }
drawdown_cents = { v = 200000, src = "M_BUILDER_ART" }
drawdown_type = { v = "eod_trailing", src = "M_BUILDER_ART" }
breach_check = { v = "intraday", src = "M_EOD", kind = "conservative", alt = ["eod"], note = "as in [eval]" }
breach_at_equal = { v = false, src = "M_EOD" }
drawdown_lock_rel_cents = { v = 10000, src = "M_BUILDER_PAGE" }
daily_loss_cents = { v = 100000, src = "M_BUILDER_ART" }
daily_loss_kind = { v = "soft", src = "M_BUILDER_ART" }
floor_after_first_payout_rel_cents = { v = 10000, src = "M_PAYOUT" }
scaling = { v = [["none", 4]], src = "M_BUILDER_ART", note = "no scaling ladder: 4 minis from the start" }
scaling_boundary = { v = "lower", src = "M_BUILDER_ART", kind = "inferred", note = "one tier: unused" }
payout_count_limit = { v = 5, src = "M_BUILDER_ART" }
inactivity_days = { v = 7, src = "M_INACT", note = "informational; an inactivity breach on Sim Funded forfeits all profits" }
funded_reset_cents = { unknown = "not published on the firm's help pages, read 2026-11-17: the resets article (M_RESET_E3) and the Rapid EOD 50k article name no reset of a breached Sim Funded account and no price", src = "M_RESET_E3", note = "not modelled: the run never buys one; never assumed available" }

[payout]
path = { v = "builder", src = "M_BUILDER_ART" }
win_day_cents = { v = "none", src = "M_BUILDER_ART", kind = "inferred", note = "no winning-day rule" }
win_day_strict = { v = false, src = "M_BUILDER_ART", kind = "inferred", note = "unused" }
win_days_required = { v = 0, src = "M_BUILDER_ART", kind = "inferred" }
traded_days_required = { v = 2, src = "M_BUILDER_ART" }
net_positive_since_last = { v = false, src = "M_BUILDER_ART", kind = "inferred", note = "the $500 net minimum binds instead" }
net_min_first_cents = { v = 50000, src = "M_BUILDER_ART" }
net_min_later_cents = { v = 50000, src = "M_BUILDER_ART" }
min_balance_rel_cents = { v = 260000, src = "M_BUILDER_ART" }
buffer_rel_cents = { v = 210000, src = "M_BUILDER_ART", note = "buffer = MLL + $100; the guide's example withdraws exactly the profit above $2,100" }
frac_of_profit_bps = { v = 10000, src = "M_BUILDER_ART", kind = "inferred", note = "no percentage limit stated" }
min_request_cents = { v = 50000, src = "M_BUILDER_ART" }
caps_cents = { v = [200000], src = "M_BUILDER_ART" }
window_cap_bps = { v = "none", src = "M_BUILDER_ART" }
window_cap_from_payout = { v = 1, src = "M_BUILDER_ART", note = "unused (no window cap)" }
consistency_bps = { v = 5000, src = "M_BUILDER_ART" }
consistency_scope = { v = "window", src = "M_BUILDER_ART" }
consistency_strict = { v = false, src = "M_BUILDER_ART" }
request_weekday = { v = "none", src = "M_BUILDER_ART", kind = "inferred" }
window_calendar_days = { v = "none", src = "M_BUILDER_ART", kind = "inferred", note = "no calendar-day payout window stated (the window is in trading days)" }
dead_days_after_payout = { v = 0, src = "M_BUILDER_ART", kind = "inferred" }
payout_day_counts = { v = false, src = "M_BUILDER_ART", kind = "conservative", alt = [true], note = "not stated; the earlier read did not count the payout day" }
split_bps = { v = 8000, src = "M_BUILDER_ART" }
split_first_full_cents = { v = "none", src = "M_BUILDER_ART", kind = "inferred" }

[fees]
billing = { v = "one_time", src = "M_BUILDER_PAGE" }
eval_price_cents = { v = 15300, src = "M_BUILDER_ART", alt = [10700, 9200], note = "list $153; $107 with 30% off; $92 with 40% off (2 uses only)" }
billing_period_calendar_days = { v = "none", src = "M_BUILDER_PAGE" }
reset_cents = { unknown = "no MFFU page states a reset price; resets are described as working the same way under the one-time model", src = "M_RESET", alt = ["none"], note = "the earlier read ran every failure as a new evaluation at $153 (alt none)" }
rebill_adds_reset_credit = { v = false, src = "M_RESET", note = "no rebill under the one-time model" }
reset_pushes_rebill = { v = false, src = "M_RESET", note = "no rebill under the one-time model" }
activation_cents = { v = 0, src = "M_BUILDER_ART" }
funded_monthly_cents = { v = 0, src = "M_BUILDER_ART", kind = "inferred", note = "no funded fee on any page" }
platform_monthly_cents = { v = 0, src = "M_BUILDER_ART", kind = "inferred", note = "no MFFU API or API fee documented" }

