max_contracts_minis = { v = 4, src = "S01" }
time_limit_calendar_days = { v = "none", src = "S01" }
flat_by = { v = "ct_1545", src = "S09" }
news_rule = { v = "none", src = "S13" }

[funded]
start_balance_cents = { v = 5000000, src = "S04" }
drawdown_cents = { v = 200000, src = "S04" }
drawdown_type = { v = "eod_trailing", src = "S03" }
breach_check = { v = "intraday", src = "S03", kind = "conservative", alt = ["eod"], note = "as in [eval]" }
breach_at_equal = { v = true, src = "S03" }
drawdown_lock_rel_cents = { v = 10000, src = "S03" }
daily_loss_cents = { unknown = "unpublished on the pages read, 2026-11-16: the pricing widget gives a $1,200 DLL below the initial trail for LucidFlex; the funded DLL once the trail has locked (LucidPro: 60% of the highest EOD profit above 52,100) is not published for Flex (the read of 2026-11-17 covered the Flex evaluation and consistency articles only)", src = "S08", kind = "conservative", alt = [120000], assume = true, note = "the run assumes the fixed $1,200 below the initial trail, kept throughout (the value this file carried before; a share-of-peak DLL above the trail would be larger)" }
daily_loss_kind = { v = "soft", src = "S07" }
floor_after_first_payout_rel_cents = { v = 10000, src = "S03", note = "MLL adjusts to the Locked MLL Balance (start + 100) on the first payout request" }
scaling = { v = [[100000, 2], [200000, 3], ["none", 4]], src = "S06", note = "simulated profit 0-999: 2 minis; 1,000-1,999: 3; 2,000+: 4; negative profit taken as the first tier" }
scaling_boundary = { v = "upper", src = "S06", note = "a profit of exactly 1,000 is in the 1,000-1,999 row; updates at the end of each session" }
payout_count_limit = { v = 5, src = "S05" }
inactivity_days = { v = 30, src = "S11" }
funded_reset_cents = { unknown = "no page or record read for this repo states whether lucid sells a reset of a breached funded account (the pages and records read 2026-11-16 and 2026-11-17 name none); not researched, so not assumed either way", note = "not modelled: the run never buys one" }

